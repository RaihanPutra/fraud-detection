server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: fraud-detection-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fraud_db
    username: fraud_user
    password: fraud_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

fraud:
  rules:
    velocity:
      max-tx-per-hour: 5
      score-high: 40
      score-medium: 20
    amount-anomaly:
      ratio-critical: 10.0
      ratio-high: 5.0
      score-critical: 35
      score-high: 20
    time-pattern:
      suspicious-start-hour: 0
      suspicious-end-hour: 4
      score: 25
  threshold:
    blocked: 70
    flagged: 40
