version: '3.8'

services:

  postgres-fraud:
    image: postgres:15-alpine
    container_name: postgres-fraud
    environment:
      POSTGRES_DB: fraud_db
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: fraud_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata-fraud:/var/lib/postgresql/data
    networks:
      - fraudengine-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-transaction:
    image: postgres:15-alpine
    container_name: postgres-transaction
    environment:
      POSTGRES_DB: transaction_db
      POSTGRES_USER: txn_user
      POSTGRES_PASSWORD: txn_pass
    ports:
      - "5434:5432"
    volumes:
      - pgdata-transaction:/var/lib/postgresql/data
    networks:
      - fraudengine-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U txn_user -d transaction_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  fraud-detection-service:
    build:
      context: ./fraud-detection-service
      dockerfile: Dockerfile
    container_name: fraud-detection-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-fraud:5432/fraud_db
      SPRING_DATASOURCE_USERNAME: fraud_user
      SPRING_DATASOURCE_PASSWORD: fraud_pass
      SERVER_PORT: 8081
    depends_on:
      postgres-fraud:
        condition: service_healthy
    networks:
      - fraudengine-network

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: transaction-service
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-transaction:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: txn_user
      SPRING_DATASOURCE_PASSWORD: txn_pass
      FRAUD_SERVICE_URL: http://fraud-detection-service:8081
      SERVER_PORT: 8080
    depends_on:
      postgres-transaction:
        condition: service_healthy
      fraud-detection-service:
        condition: service_started
    networks:
      - fraudengine-network

networks:
  fraudengine-network:
    driver: bridge

volumes:
  pgdata-fraud:
  pgdata-transaction:
